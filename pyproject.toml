[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opendart-client"
version = "0.2.0"
description = "A clean, sync, typed Python client for Korea's OpenDART (전자공시) disclosure API."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Seokhoon Joo", email = "seokhoonj@gmail.com" }]
keywords = ["opendart", "dart", "전자공시", "fss", "korea", "disclosure", "finance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial",
]
# No runtime dependencies on purpose: urllib, json, zipfile, and ElementTree from
# the standard library carry the whole client. A data client that never breaks on a
# third party's release is worth more than any convenience they would add. Rows come
# back as ``list[dict]``, which ``pandas.DataFrame`` / ``polars.DataFrame`` accept
# directly, so no DataFrame library is bundled or wrapped.
dependencies = []

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/seokhoonj/opendart-client"
Repository = "https://github.com/seokhoonj/opendart-client"

[project.scripts]
opendart = "opendart_client.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/opendart_client"]

[tool.ruff]
# 100, not 88: the OpenDART endpoint constants are long domain names
# (CONTINGENT_CAPITAL_OUTSTANDING, ...) and a one-line delegating call reads better
# whole than wrapped across three lines.
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true

# Tests get the real checks but not the annotation ceremony: `-> None` on every test
# is noise. The package itself is strict without exception -- it is the part with a
# contract.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
check_untyped_defs = true
